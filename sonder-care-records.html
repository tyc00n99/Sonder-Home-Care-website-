<title>Sonder Care Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --page:#F6F8F7; --card:#FFFFFF; --card-2:#FBFCFB;
  --ink:#1B2622; --soft:#5A6A66; --faint:#8A9894;
  --line:#DFE6E3; --line-soft:#EAEFEC;
  --accent:#2F6357; --accent-ink:#264F46; --accent-tint:#E8F0ED;
  --teal:#33697A; --teal-tint:#E9F0F2;
  --amber:#B67827; --amber-tint:#F7EEDF; --amber-ink:#7A5013;
  --red:#A4432F; --red-tint:#F6E9E5; --red-ink:#7E3221;
  --good:#3B7367; --good-tint:#E7F0ED;
  --shadow:0 1px 2px rgba(27,38,34,.05),0 4px 16px rgba(27,38,34,.05);
  --shadow-lg:0 8px 40px rgba(27,38,34,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#111917; --card:#1A2421; --card-2:#161F1C;
    --ink:#E6EDEA; --soft:#9CACA6; --faint:#6E7E79;
    --line:#2A3733; --line-soft:#233029;
    --accent:#6FB3A2; --accent-ink:#8FC9BA; --accent-tint:#1E322C;
    --teal:#6FA8BA; --teal-tint:#1D2E33;
    --amber:#D9A850; --amber-tint:#332916; --amber-ink:#E4BC74;
    --red:#D0735C; --red-tint:#37211B; --red-ink:#DE9481;
    --good:#6FB3A2; --good-tint:#1E322C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --shadow-lg:0 8px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --page:#111917; --card:#1A2421; --card-2:#161F1C;
  --ink:#E6EDEA; --soft:#9CACA6; --faint:#6E7E79;
  --line:#2A3733; --line-soft:#233029;
  --accent:#6FB3A2; --accent-ink:#8FC9BA; --accent-tint:#1E322C;
  --teal:#6FA8BA; --teal-tint:#1D2E33;
  --amber:#D9A850; --amber-tint:#332916; --amber-ink:#E4BC74;
  --red:#D0735C; --red-tint:#37211B; --red-ink:#DE9481;
  --good:#6FB3A2; --good-tint:#1E322C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--page); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Charter","Iowan Old Style","Palatino Linotype",Georgia,serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:228px;flex:0 0 228px;position:sticky;top:0;height:100vh;
  border-right:1px solid var(--line);background:var(--card-2);
  display:flex;flex-direction:column;padding:22px 14px 18px;
}
.wordmark{padding:0 10px 4px}
.wordmark .wm-name{font-family:"Charter","Iowan Old Style",Georgia,serif;font-size:21px;letter-spacing:.01em}
.wordmark .wm-sub{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--soft);margin-top:1px}
.nav{margin-top:26px;display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px;color:var(--soft);font-weight:500;font-size:14px;
}
.nav button:hover{background:var(--line-soft);color:var(--ink)}
.nav button.on{background:var(--accent-tint);color:var(--accent-ink);font-weight:600}
.nav svg{width:17px;height:17px;flex:0 0 17px}
.nav .count{margin-left:auto;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--faint)}
.nav button.on .count{color:var(--accent-ink)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.55}
.side-foot b{color:var(--soft);font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:14px 28px;background:color-mix(in srgb,var(--page) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.search{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--faint);
}
.search input{border:0;background:none;outline:none;flex:1;font-size:14px}
.search input::placeholder{color:var(--faint)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;
  font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--card);
}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1613}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1613}}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--red)}

.content{padding:26px 28px 60px;max-width:1180px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:baseline;gap:14px;margin-bottom:4px;flex-wrap:wrap}
.page-h h1{font-family:"Charter","Iowan Old Style",Georgia,serif;font-size:26px;font-weight:600;letter-spacing:.005em;text-wrap:balance}
.page-h .stat-ref{font-size:12px;color:var(--faint)}
.page-sub{color:var(--soft);margin-bottom:22px;max-width:64ch}

/* ---------- cards / tables ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card .card-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line-soft)}
.card .card-h h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--soft)}
.card .card-h .spacer{flex:1}
.card .card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--line-soft)}
td .who{font-weight:600}
td .sub{font-size:12px;color:var(--soft)}
.num{font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}

/* ---------- pills / status ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:99px;background:currentColor}
.p-good{background:var(--good-tint);color:var(--good)}
.p-warn{background:var(--amber-tint);color:var(--amber-ink)}
.p-bad{background:var(--red-tint);color:var(--red-ink)}
.p-mut{background:var(--line-soft);color:var(--soft)}
.p-teal{background:var(--teal-tint);color:var(--teal)}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:600}
.kpi .k-val{font-family:"Charter","Iowan Old Style",Georgia,serif;font-size:30px;line-height:1.15;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:12px;color:var(--soft);margin-top:2px}
.kpi.alert .k-val{color:var(--red)}
.kpi.watch .k-val{color:var(--amber-ink)}
.alert-row{display:flex;align-items:flex-start;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.alert-row:hover{background:var(--line-soft)}
.alert-row:last-child{border-bottom:0}
.alert-row .a-dot{width:8px;height:8px;border-radius:99px;margin-top:6px;flex:0 0 8px}
.alert-row .a-body{flex:1;min-width:0}
.alert-row .a-title{font-weight:600;font-size:13.5px}
.alert-row .a-sub{font-size:12.5px;color:var(--soft)}
.alert-row .a-when{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{padding:26px 18px;text-align:center;color:var(--faint);font-size:13.5px}

/* ---------- list pages ---------- */
.list-tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--soft);background:var(--card)}
.chip.on{background:var(--accent-tint);border-color:transparent;color:var(--accent-ink);font-weight:600}

/* ---------- detail ---------- */
.crumb{font-size:13px;color:var(--soft);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.crumb button{color:var(--accent-ink);font-weight:600}
.crumb button:hover{text-decoration:underline}
.det-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:12px;background:var(--accent-tint);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;font-family:"Charter",Georgia,serif}
.avatar.client{background:var(--teal-tint);color:var(--teal)}
.det-head h1{font-family:"Charter","Iowan Old Style",Georgia,serif;font-size:24px;font-weight:600}
.det-head .d-sub{color:var(--soft);font-size:13.5px}
.det-head .d-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tabs .t-badge{display:inline-block;margin-left:6px;font-size:10.5px;background:var(--red-tint);color:var(--red-ink);border-radius:99px;padding:1px 6px;font-variant-numeric:tabular-nums}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media(max-width:700px){.fields{grid-template-columns:1fr}}
.field{padding:9px 0;border-bottom:1px solid var(--line-soft)}
.field .f-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:600}
.field .f-val{margin-top:2px;font-size:14px}
.field .f-val.missing{color:var(--red);font-style:italic}

/* ---------- doc checklist ---------- */
.doc-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line-soft)}
.doc-row:last-child{border-bottom:0}
.doc-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.doc-ic.got{background:var(--good-tint);color:var(--good)}
.doc-ic.miss{background:var(--red-tint);color:var(--red)}
.doc-ic.exp{background:var(--amber-tint);color:var(--amber-ink)}
.doc-ic svg{width:16px;height:16px}
.doc-body{flex:1;min-width:0}
.doc-name{font-weight:600;font-size:13.5px}
.doc-meta{font-size:12px;color:var(--soft)}
.doc-req{font-size:10.5px;color:var(--faint)}

/* ---------- timeline / notes ---------- */
.note{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.note:last-child{border-bottom:0}
.note .n-head{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--soft);margin-bottom:3px}
.note .n-head b{color:var(--ink);font-weight:600}
.note .n-text{font-size:13.5px;white-space:pre-wrap}

/* ---------- compliance matrix ---------- */
.mx-cell{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center}
.mx-cell svg{width:12px;height:12px}
.mx-got{background:var(--good-tint);color:var(--good)}
.mx-miss{background:var(--red-tint);color:var(--red)}
.mx-exp{background:var(--amber-tint);color:var(--amber-ink)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--soft);align-items:center;flex-wrap:wrap}
.legend .mx-cell{width:16px;height:16px;border-radius:4px}

/* ---------- modal / forms ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,20,18,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px}
.modal .m-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.modal .m-h h2{font-family:"Charter",Georgia,serif;font-size:18px;font-weight:600}
.modal .m-h button{margin-left:auto;color:var(--faint);font-size:20px;line-height:1}
.modal .m-b{padding:18px 20px;display:grid;gap:13px}
.modal .m-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line-soft)}
.fg{display:grid;gap:4px}
.fg label{font-size:12px;font-weight:600;color:var(--soft)}
.fg input,.fg select,.fg textarea{background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:14px;width:100%}
.fg textarea{min-height:80px;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:520px){.frow{grid-template-columns:1fr}}
.hint{font-size:11.5px;color:var(--faint)}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 18px;border-radius:10px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);z-index:99;opacity:0;transition:opacity .18s, transform .18s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.mt{margin-top:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media(max-width:840px){
  .side{width:64px;flex-basis:64px;padding:18px 8px}
  .wordmark .wm-name{font-size:15px;text-align:center}
  .wordmark .wm-sub,.nav button span.lbl,.nav .count,.side-foot{display:none}
  .nav button{justify-content:center}
  .content{padding:20px 16px 60px}
}
</style>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= icons ================= */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',

  client:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.4-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.4 12c-1.9 4.4-9.4 9-9.4 9Z"/></svg>',

  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3V4Z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H18"/></svg>',
  search:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',

  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.2 1.9"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

};

/* ================= dates ================= */
const TODAY = new Date().toISOString().slice(0,10);
function days(from,to){ return Math.round((new Date(to)-new Date(from))/864e5); }
function fmt(d){ if(!d) return '—'; const dt=new Date(d+'T12:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(n){ return n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

/* ================= required documents (245D) ================= */
const STAFF_DOCS = [
  {key:'application', name:'Employment application', req:'§ 245D.095, subd. 5(1)'},
  {key:'jobDuties', name:'Job description acknowledgment (signed)', req:'§ 245D.095, subd. 5(2)'},
  {key:'qualifications', name:'Documentation of qualifications for position', req:'§ 245D.095, subd. 5(3)'},
  {key:'background', name:'Background study (NETStudy 2.0)', req:'Chapter 245C'},
  {key:'orientation', name:'Orientation record', req:'§ 245D.09, subd. 4'},
  {key:'training', name:'Annual training certificates', req:'§ 245D.09, subd. 5'},
  {key:'evaluation', name:'Performance evaluation', req:'§ 245D.095, subd. 5(5)'},
];
const CLIENT_DOCS = [
  {key:'admission', name:'Admission form (signed)', req:'§ 245D.095, subd. 3(1)'},
  {key:'eligibility', name:'Service initiation / eligibility documentation', req:'§ 245D.095, subd. 3'},
  {key:'cssp', name:'CSSP / support plan', req:'§ 245D.02, subd. 4b'},
  {key:'csspAddendum', name:'CSSP addendum', req:'§ 245D.02, subd. 4c'},
  {key:'iapp', name:'IAPP (abuse prevention plan)', req:'§ 245A.65, subd. 2'},
  {key:'medOrders', name:'Medication / treatment orders', req:'§ 245D.05, subd. 1'},
  {key:'medAuth', name:'Signed medication authorization', req:'§ 245D.05, subd. 2'},
  {key:'serviceAuth', name:'Service authorization (units)', req:'County / MA'},
];

/* ================= seed data ================= */
const SEED = {
  staff: [
    { id:'s1', name:'Jordan Lee', role:'Direct Support Professional', phone:'(612) 555-0141', email:'jordan@sonderhomecare.com', status:'Active',
      hireDate:'2025-03-10', applicationDate:'2025-03-01', jobDutiesAckDate:'2025-03-10',
      background:{submitted:'2025-03-02', result:'Eligible', date:'2025-03-08'},
      firstSupervised:'2025-03-17', firstUnsupervised:'2025-04-02',
      trainings:[
        {subject:'Orientation to program requirements', date:'2025-03-12', hours:8, trainer:'A. Osman (Coordinator)', expires:''},
        {subject:'Person-centered service planning (annual)', date:'2026-03-09', hours:4, trainer:'MN DSP Training Portal', expires:'2027-03-09'},

/* ================= state ================= */
const LS_KEY = 'sonder-care-records-v1';
let db;
try { db = JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch(e){ db = null; }
if(!db || !db.staff || !db.clients) db = JSON.parse(JSON.stringify(SEED));
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch(e){} }

let ui = { view:'dashboard', id:null, tab:null, q:'', filter:'all' };

/* ================= compliance engine ================= */
function docState(entry, expiresHint){
  if(!entry || entry.status==='missing') return 'miss';
  if(entry.status==='na') return 'na';
  if(entry.status==='expired') return 'exp';
  if(expiresHint && days(TODAY, expiresHint) < 0) return 'exp';
  return 'got';
}
function staffAlerts(s){
  const a=[];
  for(const t of s.trainings){
    if(!t.expires) continue;
    const d = days(TODAY, t.expires);
    if(d<0) a.push({sev:'bad', title:`Training expired: ${t.subject}`, sub:s.name, when:fmt(t.expires), go:()=>open('staff',s.id,'training')});
    else if(d<=60) a.push({sev:'warn', title:`Training expires in ${d} days: ${t.subject}`, sub:s.name, when:fmt(t.expires), go:()=>open('staff',s.id,'training')});
  }
  if(s.background.result==='Pending') a.push({sev:'warn', title:'Background study pending — no unsupervised contact permitted', sub:s.name, when:'Submitted '+fmt(s.background.submitted), go:()=>open('staff',s.id,'profile')});
  const miss = STAFF_DOCS.filter(d=>docState(s.docs[d.key])==='miss');
  if(miss.length) a.push({sev:'bad', title:`${miss.length} required document${miss.length>1?'s':''} missing`, sub:s.name+' — '+miss.map(m=>m.name).slice(0,2).join(', ')+(miss.length>2?'…':''), when:'', go:()=>open('staff',s.id,'docs')});
  return a;
}
function clientAlerts(c){
  const a=[];
  if(c.status!=='Active') return a;
  if(c.iappReview){
    const d = days(TODAY, c.iappReview);
    if(d<0) a.push({sev:'bad', title:'IAPP annual review overdue', sub:c.name, when:'Due '+fmt(c.iappReview), go:()=>open('clients',c.id,'plans')});
    else if(d<=60) a.push({sev:'warn', title:`IAPP review due in ${d} days`, sub:c.name, when:fmt(c.iappReview), go:()=>open('clients',c.id,'plans')});
  }
  const miss = CLIENT_DOCS.filter(d=>docState(c.docs[d.key])==='miss');
  if(miss.length) a.push({sev:'bad', title:`${miss.length} required document${miss.length>1?'s':''} missing`, sub:c.name+' — '+miss.map(m=>m.name).slice(0,2).join(', ')+(miss.length>2?'…':''), when:'', go:()=>open('clients',c.id,'docs')});
  const exp = CLIENT_DOCS.filter(d=>docState(c.docs[d.key])==='exp');
  if(exp.length) a.push({sev:'warn', title:`${exp.length} document${exp.length>1?'s':''} expired / needs renewal`, sub:c.name+' — '+exp.map(m=>m.name).join(', '), when:'', go:()=>open('clients',c.id,'docs')});
  return a;
}
function allAlerts(){
  const a = [...db.staff.flatMap(staffAlerts), ...db.clients.flatMap(clientAlerts)];
  return a.sort((x,y)=> (x.sev==='bad'?0:1)-(y.sev==='bad'?0:1));
}

/* ================= navigation ================= */
function open(view,id=null,tab=null){ ui.view=view; ui.id=id; ui.tab=tab; ui.q=''; ui.filter='all'; render(); window.scrollTo(0,0); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }

/* ================= render ================= */
const app = document.getElementById('app');
function render(){
  const alerts = allAlerts();
  const navItem=(key,icon,label,count)=>`
    <button class="${ui.view===key?'on':''}" data-nav="${key}">${icon}<span class="lbl">${label}</span>${count!=null?`<span class="count num">${count}</span>`:''}</button>`;
  app.innerHTML = `
  <aside class="side">
    <div class="wordmark">
      <div class="wm-name">Sonder</div>
      <div class="wm-sub">Care Records</div>
    </div>
    <nav class="nav">
      ${navItem('dashboard',I.home,'Dashboard',null)}
      ${navItem('staff',I.staff,'Caregivers',db.staff.length)}
      ${navItem('clients',I.client,'Clients',db.clients.filter(c=>c.status==='Active').length)}
      ${navItem('compliance',I.shield,'Compliance',alerts.length||null)}
      ${navItem('register',I.book,'Register',null)}
    </nav>
    <div class="side-foot"><b>245D basic + intensive</b><br>Record standards per Minn. Stat. § 245D.095. Demo data only — not for live PHI.</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="search">${I.search}<input id="q" placeholder="Search caregivers and clients…" value="${esc(ui.q)}" aria-label="Search"></div>
      <span style="flex:1"></span>
      <button class="btn" data-act="addStaff">${I.plus} Caregiver</button>
      <button class="btn primary" data-act="addClient">${I.plus} Client</button>
    </div>
    <div class="content" id="view"></div>
  </div>`;
  const v = document.getElementById('view');
  if(ui.q) v.innerHTML = vSearch();
  else if(ui.view==='dashboard') v.innerHTML = vDash(alerts);
  else if(ui.view==='staff') v.innerHTML = ui.id? vStaffDetail() : vStaffList();
  else if(ui.view==='clients') v.innerHTML = ui.id? vClientDetail() : vClientList();
  else if(ui.view==='compliance') v.innerHTML = vCompliance(alerts);
  else if(ui.view==='register') v.innerHTML = vRegister();
  wire();
}

/* ---------- dashboard ---------- */
function vDash(alerts){
  const bad = alerts.filter(a=>a.sev==='bad').length, warn = alerts.filter(a=>a.sev==='warn').length;
  const expSoon = db.staff.flatMap(s=>s.trainings.filter(t=>t.expires && days(TODAY,t.expires)<=60)).length;
  const recentNotes = db.clients.flatMap(c=>c.notes.map(n=>({...n, client:c.name, cid:c.id}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  return `
  <div class="page-h"><h1>Good ${new Date().getHours()<12?'morning':'afternoon'} — here's where things stand</h1></div>
  <p class="page-sub">${fmt(TODAY)} · ${db.clients.filter(c=>c.status==='Active').length} active clients · ${db.staff.filter(s=>s.status==='Active').length} active caregivers</p>
  <div class="kpis">
    <div class="kpi ${bad?'alert':''}"><div class="k-label">Action needed</div><div class="k-val num">${bad}</div><div class="k-sub">missing or overdue items</div></div>
    <div class="kpi ${warn?'watch':''}"><div class="k-label">Coming due</div><div class="k-val num">${warn}</div><div class="k-sub">within the next 60 days</div></div>
    <div class="kpi"><div class="k-label">Trainings expiring</div><div class="k-val num">${expSoon}</div><div class="k-sub">in the next 60 days</div></div>
    <div class="kpi"><div class="k-label">Active clients</div><div class="k-val num">${db.clients.filter(c=>c.status==='Active').length}</div><div class="k-sub">${db.clients.filter(c=>c.status!=='Active').length} discharged on register</div></div>
  </div>
  <div class="grid g2">
    <div class="card">
      <div class="card-h"><h3>Compliance alerts</h3><span class="spacer"></span><button class="btn sm" data-nav="compliance">View all</button></div>
      ${alerts.length? alerts.slice(0,7).map((a,i)=>alertRow(a,i)).join('') : `<div class="empty">Everything current. Nothing needs attention.</div>`}
    </div>
    <div class="card">
      <div class="card-h"><h3>Recent service documentation</h3></div>
      ${recentNotes.length? recentNotes.map(n=>`
        <div class="alert-row" data-open="clients:${n.cid}:notes">
          <div class="a-dot" style="background:var(--teal)"></div>
          <div class="a-body"><div class="a-title">${esc(n.client)}</div><div class="a-sub">${esc(n.text.length>90?n.text.slice(0,90)+'…':n.text)}</div></div>
          <div class="a-when">${fmt(n.date)}</div>
        </div>`).join('') : `<div class="empty">No service notes yet.</div>`}
    </div>
  </div>`;
}
function alertRow(a,i){
  return `<div class="alert-row" data-alert="${i}">
    <div class="a-dot" style="background:${a.sev==='bad'?'var(--red)':'var(--amber)'}"></div>
    <div class="a-body"><div class="a-title">${esc(a.title)}</div><div class="a-sub">${esc(a.sub)}</div></div>
    ${a.when?`<div class="a-when">${esc(a.when)}</div>`:''}
  </div>`;
}

/* ---------- search ---------- */
function vSearch(){
  const q = ui.q.toLowerCase();
  const st = db.staff.filter(s=>s.name.toLowerCase().includes(q)||s.role.toLowerCase().includes(q));
  const cl = db.clients.filter(c=>c.name.toLowerCase().includes(q)||(c.caseManager||'').toLowerCase().includes(q));
  return `
  <div class="page-h"><h1>Results for “${esc(ui.q)}”</h1></div>
  <div class="grid g2 mt">
    <div class="card"><div class="card-h"><h3>Caregivers (${st.length})</h3></div>
      ${st.length? st.map(s=>`<div class="alert-row" data-open="staff:${s.id}:profile"><div class="avatar" style="width:34px;height:34px;font-size:13px;border-radius:9px">${initials(s.name)}</div><div class="a-body"><div class="a-title">${esc(s.name)}</div><div class="a-sub">${esc(s.role)}</div></div></div>`).join(''):`<div class="empty">No matches</div>`}</div>
    <div class="card"><div class="card-h"><h3>Clients (${cl.length})</h3></div>
      ${cl.length? cl.map(c=>`<div class="alert-row" data-open="clients:${c.id}:overview"><div class="avatar client" style="width:34px;height:34px;font-size:13px;border-radius:9px">${initials(c.name)}</div><div class="a-body"><div class="a-title">${esc(c.name)}</div><div class="a-sub">${esc(c.caseManager||'')}</div></div></div>`).join(''):`<div class="empty">No matches</div>`}</div>
  </div>`;
}

/* ---------- staff list ---------- */
function staffDocSummary(s){
  const miss = STAFF_DOCS.filter(d=>docState(s.docs[d.key])==='miss').length;
  const exp = s.trainings.filter(t=>t.expires && days(TODAY,t.expires)<0).length;
  if(miss) return `<span class="pill p-bad"><span class="dot"></span>${miss} missing</span>`;
  if(exp) return `<span class="pill p-warn"><span class="dot"></span>training expired</span>`;
  const soon = s.trainings.filter(t=>t.expires && days(TODAY,t.expires)>=0 && days(TODAY,t.expires)<=60).length;
  if(soon) return `<span class="pill p-warn"><span class="dot"></span>due soon</span>`;
  return `<span class="pill p-good"><span class="dot"></span>complete</span>`;
}

      return `<div class="doc-row">

/* ================= modals ================= */
function modal(title, bodyHTML, onSubmit, submitLabel='Save'){
  const scrim = document.createElement('div'); scrim.className='scrim';
  scrim.innerHTML = `<div class="modal" role="dialog" aria-label="${esc(title)}">
    <div class="m-h"><h2>${esc(title)}</h2><button data-close aria-label="Close">×</button></div>
    <form><div class="m-b">${bodyHTML}</div>
    <div class="m-f"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">${esc(submitLabel)}</button></div></form>
  </div>`;
  document.body.appendChild(scrim);
  scrim.addEventListener('click', e=>{ if(e.target===scrim || e.target.closest('[data-close]')) scrim.remove(); });
  scrim.querySelector('form').addEventListener('submit', e=>{
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target).entries());
    if(onSubmit(f)!==false){ scrim.remove(); save(); render(); }
  });
  const first = scrim.querySelector('input,select,textarea'); if(first) first.focus();
}
const fg=(label,name,attrs='',type='input',opts='')=> type==='select'

  : type==='textarea' ? `<div class="fg"><label>${label}</label><textarea name="${name}" ${attrs}></textarea></div>`
  : `<div class="fg"><label>${label}</label><input name="${name}" ${attrs}></div>`;

      docs:Object.fromEntries(CLIENT_DOCS.map(d=>[d.key,{status:'missing'}])) });
    toast('Client admitted — added to register'); ui.view='clients'; ui.id=db.clients[db.clients.length-1].id; ui.tab='overview';
  }, 'Admit client');
}
function addTrainingModal(s){
  modal('Log training — '+s.name, `
    ${fg('Subject','subject','required placeholder="e.g. Medication administration"')}
    <div class="frow">${fg('Date','date',`type="date" value="${TODAY}" required`)}${fg('Hours','hours','type="number" step="0.5" min="0.5" value="1" required')}</div>
    ${fg('Trainer','trainer','placeholder="Name or organization"')}
    ${fg('Expires (annual refresh)','expires','type="date"')}
  `, f=>{
    s.trainings.push({subject:f.subject, date:f.date, hours:Number(f.hours), trainer:f.trainer||'', expires:f.expires||''});
    toast('Training logged');
  }, 'Log training');
}
function addEvalModal(s){
  modal('Performance evaluation — '+s.name, `
    <div class="frow">${fg('Date','date',`type="date" value="${TODAY}" required`)}${fg('Evaluated by','by','required')}</div>
    ${fg('Summary','note','required','textarea')}
  `, f=>{ s.evaluations.unshift({date:f.date, by:f.by, note:f.note}); toast('Evaluation added'); });
}
function addNoteModal(c){
  modal('Service note — '+c.name, `
    <div class="frow">${fg('Date','date',`type="date" value="${TODAY}" required`)}${fg('Staff','by','required placeholder="Your name"')}</div>
    ${fg('Documentation','text','required placeholder="What service was provided, progress toward outcomes, anything notable…"','textarea')}
  `, f=>{ c.notes.push({date:f.date, by:f.by, text:f.text}); toast('Note saved'); });
}
function dischargeModal(c){
  modal('Discharge — '+c.name, `
    ${fg('Discharge date','date',`type="date" value="${TODAY}" required`)}
    ${fg('Summary / reason','text','required placeholder="Reason for discharge, where services transferred, summary…"','textarea')}
    <div class="hint">Discharge closes the record and updates the admission & discharge register. The file itself is retained per record-retention requirements.</div>
  `, f=>{
    c.status='Discharged'; c.discharged=f.date; c.iappReview='';
    c.notes.push({date:f.date, by:'Record', text:'DISCHARGE: '+f.text});
    toast('Client discharged — register updated');
  }, 'Discharge');
}
function uploadDoc(kind, key){
  const entity = kind==='staff'? db.staff.find(x=>x.id===ui.id) : db.clients.find(x=>x.id===ui.id);
  const input = document.createElement('input'); input.type='file'; input.accept='.pdf,.doc,.docx,.jpg,.png';
  input.onchange = ()=>{
    const file = input.files[0]; if(!file) return;
    entity.docs[key] = {status:'received', file:file.name, date:TODAY};
    save(); render(); toast('Recorded: '+file.name);
  };
  input.click();
}

/* ================= events ================= */
function wire(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>open(el.dataset.nav)));
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{ const [v,id,t]=el.dataset.open.split(':'); open(v,id,t); }));
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{ ui.tab=el.dataset.tab; render(); }));
  document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{ ui.filter=el.dataset.filter; render(); }));
  document.querySelectorAll('[data-alert]').forEach(el=>el.addEventListener('click',()=>{ allAlerts()[Number(el.dataset.alert)]?.go(); }));
  document.querySelectorAll('[data-updoc]').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); const [k,key]=el.dataset.updoc.split(':'); uploadDoc(k,key); }));
  document.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>{
    const act = el.dataset.act;
    const s = db.staff.find(x=>x.id===ui.id), c = db.clients.find(x=>x.id===ui.id);
    if(act==='addStaff') addStaffModal();
    else if(act==='addClient') addClientModal();
    else if(act==='addTraining'&&s) addTrainingModal(s);
    else if(act==='addEval'&&s) addEvalModal(s);
    else if(act==='addNote'&&c) addNoteModal(c);
    else if(act==='discharge'&&c) dischargeModal(c);
    else if(act==='iappReviewed'&&c){ const n=new Date(); n.setFullYear(n.getFullYear()+1); c.iappReview=n.toISOString().slice(0,10); save(); render(); toast('IAPP review recorded'); }
  }));
  const q = document.getElementById('q');
  q.addEventListener('input', ()=>{ ui.q=q.value; const v=document.getElementById('view'); v.innerHTML = ui.q? vSearch() : (ui.view==='dashboard'? vDash(allAlerts()) : ui.view==='staff'? (ui.id?vStaffDetail():vStaffList()) : ui.view==='clients'? (ui.id?vClientDetail():vClientList()) : ui.view==='compliance'? vCompliance(allAlerts()) : vRegister()); wire2(); });
}

  v.querySelectorAll('[data-alert]').forEach(el=>el.addEventListener('click',()=>{ allAlerts()[Number(el.dataset.alert)]?.go(); }));
  v.querySelectorAll('[data-updoc]').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); const [k,key]=el.dataset.updoc.split(':'); uploadDoc(k,key); }));
  v.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>{
    const act = el.dataset.act;
    const s = db.staff.find(x=>x.id===ui.id), c = db.clients.find(x=>x.id===ui.id);
    if(act==='addTraining'&&s) addTrainingModal(s);
    else if(act==='addEval'&&s) addEvalModal(s);
    else if(act==='addNote'&&c) addNoteModal(c);
    else if(act==='discharge'&&c) dischargeModal(c);
    else if(act==='iappReviewed'&&c){ const n=new Date(); n.setFullYear(n.getFullYear()+1); c.iappReview=n.toISOString().slice(0,10); save(); render(); toast('IAPP review recorded'); }
  }));
}
render();
